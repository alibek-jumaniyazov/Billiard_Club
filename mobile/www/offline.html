<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <title>Billiard Club — aloqa yo'q</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0d0c; color: #efe9dd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 24px; box-sizing: border-box; text-align: center; }
      .table { width: 180px; height: 96px; border-radius: 14px; padding: 8px; box-sizing: border-box; background: linear-gradient(160deg, #7a5030, #55351f 45%, #2f1d11); box-shadow: 0 10px 26px rgba(0, 0, 0, .45); }
      .felt { width: 100%; height: 100%; border-radius: 6px; background: linear-gradient(180deg, #23784e, #175a3a); filter: brightness(.55) saturate(.7); }
      h1 { margin: 10px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
      p { margin: 0; max-width: 320px; color: #aca697; font-size: 14px; line-height: 1.6; }
      button { margin-top: 8px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #cfae62; color: #15130e; font: inherit; font-weight: 700; font-size: 15px; }
      button:active { background: #b3924a; }
      .ru { color: #78746b; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="table" aria-hidden="true"><div class="felt"></div></div>
      <h1>Server bilan aloqa yo'q</h1>
      <p>Internet yoki Wi-Fi ulanishini tekshiring. Kassa avval ochilgan bo'lsa, ma'lumotlar qurilmada saqlanib turadi.</p>
      <p class="ru">Нет связи с сервером. Проверьте интернет и попробуйте снова.</p>
      <button type="button" onclick="location.replace('/')">Qayta urinish · Повторить</button>
    </main>
  </body>
</html>
