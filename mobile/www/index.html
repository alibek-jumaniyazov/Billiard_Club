<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <title>Billiard Club</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0d0c; color: #efe9dd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { display: grid; place-items: center; }
      .mark { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(160deg, #1f6e47, #0b2318); box-shadow: 0 0 0 1.5px rgba(207, 174, 98, .6) inset; position: relative; }
      .mark::after { content: ''; position: absolute; width: 26px; height: 26px; border-radius: 50%; right: 12px; bottom: 12px; background: radial-gradient(circle at 32% 28%, #dcc07e, #cfae62 55%, #b3924a); }
    </style>
  </head>
  <body>
    <!-- Ilova serverdagi manzilni ochadi (capacitor.config.ts → server.url);
         bu sahifa faqat yuklanish paytida bir lahza ko'rinishi mumkin. -->
    <div class="mark" aria-label="Billiard Club"></div>
  </body>
</html>
