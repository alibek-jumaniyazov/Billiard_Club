<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Billiard Club">
  <!-- "B" monogrammasi: tik kiy + ikki fil suyagi shar. Geometriya desktop/build/make-icons.mjs (MARK) va BrandLogo.tsx bilan bir xil. -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18774c"/>
      <stop offset="1" stop-color="#08261a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#23a066" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#23a066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c677"/>
      <stop offset="0.3" stop-color="#f5dfa6"/>
      <stop offset="0.65" stop-color="#dbb35c"/>
      <stop offset="1" stop-color="#bd954a"/>
    </linearGradient>
    <radialGradient id="ivory" cx="0.31" cy="0.29" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f3eee2"/>
      <stop offset="1" stop-color="#c4b9a2"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stem"><rect x="13.6" y="8" width="5" height="32" rx="2.5"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.8" dy="1.3" stdDeviation="0.9" flood-color="#03120b" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#felt)"/>
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#lamp)"/>
  <rect x="2.8" y="2.8" width="42.4" height="42.4" rx="10.2" fill="none" stroke="#dbb35c" stroke-opacity="0.75" stroke-width="0.6"/>
  <g filter="url(#shadow)">
    <rect x="13.6" y="8" width="5" height="32" rx="2.5" fill="url(#cue)"/>
    <g clip-path="url(#stem)">
      <rect x="13.6" y="8" width="5" height="2.6" fill="#f3eee2"/>
      <rect x="13.6" y="10.6" width="5" height="0.5" fill="#bd954a"/>
    </g>
    <circle cx="24.9" cy="15.5" r="7.5" fill="url(#ivory)"/>
    <circle cx="25.9" cy="31.5" r="8.5" fill="url(#ivory)"/>
  </g>
  <circle cx="22.2" cy="12.2" r="1.8" fill="url(#spec)"/>
  <circle cx="22.84" cy="27.76" r="2.04" fill="url(#spec)"/>
</svg>
