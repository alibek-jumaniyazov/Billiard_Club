<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph muqovasi (dizayn manbasi). Ijtimoiy tarmoqlar SVG ni har doim
    ko'rsatmaydi — public/og-cover.png shu fayldan eksport qilinadi
    (index.html og:image PNG ga ishora qiladi). Ranglar: src/theme/tokens.ts,
    belgi: favicon.svg ("B" monogrammasi) bilan bir xil.
  -->
  <defs>
    <radialGradient id="lamp" cx="0.78" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#18774c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#18774c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b8455"/>
      <stop offset="1" stop-color="#0b3a26"/>
    </linearGradient>
    <radialGradient id="feltLight" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5030"/>
      <stop offset="1" stop-color="#2f1d11"/>
    </linearGradient>
    <radialGradient id="ivory" cx="0.33" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f3eee2"/>
      <stop offset="1" stop-color="#b9ad94"/>
    </radialGradient>
    <radialGradient id="red" cx="0.33" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ff8f84"/>
      <stop offset="0.45" stop-color="#d23b30"/>
      <stop offset="1" stop-color="#7d1a14"/>
    </radialGradient>
    <radialGradient id="pocket" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.75" stop-color="#050807"/>
      <stop offset="1" stop-color="#1a120b"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Belgi gradientlari -->
    <linearGradient id="mFelt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18774c"/><stop offset="1" stop-color="#08261a"/></linearGradient>
    <linearGradient id="mCue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8c677"/><stop offset=".3" stop-color="#f5dfa6"/><stop offset=".65" stop-color="#dbb35c"/><stop offset="1" stop-color="#bd954a"/></linearGradient>
    <radialGradient id="mIvory" cx=".31" cy=".29" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#f3eee2"/><stop offset="1" stop-color="#c4b9a2"/></radialGradient>
  </defs>

  <!-- Zal foni + stol ustidagi chiroq yorug'i -->
  <rect width="1200" height="630" fill="#090c0b"/>
  <rect width="1200" height="630" fill="url(#lamp)"/>

  <!-- O'ng tomon: stol burchagi (yuqoridan ko'rinish) -->
  <g transform="translate(700, 70) rotate(-8 260 245)">
    <rect x="0" y="0" width="560" height="500" rx="34" fill="url(#wood)"/>
    <rect x="34" y="34" width="560" height="500" rx="10" fill="#0b3a26"/>
    <rect x="44" y="44" width="560" height="500" rx="6" fill="url(#felt)"/>
    <rect x="44" y="44" width="560" height="500" fill="url(#feltLight)"/>
    <circle cx="44" cy="44" r="30" fill="url(#pocket)"/>
    <circle cx="292" cy="22" r="26" fill="url(#pocket)"/>
    <g fill="#e8c677" fill-opacity="0.8">
      <circle cx="140" cy="17" r="4"/><circle cx="210" cy="17" r="4"/><circle cx="370" cy="17" r="4"/><circle cx="440" cy="17" r="4"/>
      <circle cx="17" cy="140" r="4"/><circle cx="17" cy="210" r="4"/><circle cx="17" cy="280" r="4"/><circle cx="17" cy="350" r="4"/>
    </g>
    <g filter="url(#soft)">
      <circle cx="250" cy="250" r="36" fill="url(#ivory)"/>
      <circle cx="318" cy="290" r="36" fill="url(#ivory)"/>
      <circle cx="250" cy="330" r="36" fill="url(#ivory)"/>
      <circle cx="160" cy="170" r="36" fill="url(#red)"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="22" text-anchor="middle" fill="#2b2418">
      <text x="250" y="258">1</text><text x="318" y="298">2</text><text x="250" y="338">3</text>
    </g>
  </g>

  <!-- Brend belgisi -->
  <g transform="translate(96, 92) scale(2.5)">
    <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#mFelt)"/>
    <rect x="2.8" y="2.8" width="42.4" height="42.4" rx="10.2" fill="none" stroke="#dbb35c" stroke-opacity=".75" stroke-width=".6"/>
    <rect x="13.6" y="8" width="5" height="32" rx="2.5" fill="url(#mCue)"/>
    <circle cx="24.9" cy="15.5" r="7.5" fill="url(#mIvory)"/>
    <circle cx="25.9" cy="31.5" r="8.5" fill="url(#mIvory)"/>
  </g>

  <!-- Matn -->
  <text x="96" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="5" fill="#f1ece1">BILLIARD <tspan fill="#dbb35c">CLUB</tspan></text>
  <text x="96" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#b5ae9f">Billiard klublari uchun boshqaruv tizimi</text>
  <text x="96" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#8b8579">Stol taymeri · Chiroq avtomatikasi · Bar · Kassa · Hisobot</text>

  <!-- CTA -->
  <g transform="translate(96, 456)">
    <rect x="0" y="0" width="300" height="62" rx="31" fill="#dbb35c"/>
    <text x="150" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17130a">Bepul sinab ko'ring</text>
  </g>
  <text x="420" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8b8579">Windows · Android · Brauzer</text>

  <!-- Pastki oltin chiziq -->
  <rect x="0" y="624" width="1200" height="6" fill="#dbb35c"/>
</svg>
