<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!-- Qidiruv tizimlari tasdiqlash teglari — <head> ning eng boshida (ba'zi
         tekshiruvchilar sahifaning faqat boshini o'qiydi). vite-plugin-seo.ts -->
    <!--seo:verify--><!--/seo:verify-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Qidiruv tizimlari va eski brauzerlar /favicon.ico ni so'raydi (48×48) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="mask-icon" href="/favicon.svg" color="#d4af37" />
    <!-- iOS SVG ikonkani tushunmaydi — «Bosh ekranga qo'shish» uchun PNG kerak -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color = PALETTES[rejim].themeColor (src/theme/tokens.ts): och — #f3efe6,
         qorong'i — #0b0d0c. Quyidagi skript tanlangan rejimga darhol moslaydi. -->
    <meta name="theme-color" content="#f3efe6" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA / mobil ilova ko'rinishi -->
    <meta name="application-name" content="Billiard Club" />
    <meta name="apple-mobile-web-app-title" content="Billiard Club" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="Billiard Club" />

    <!-- JavaScript ishlasa sahifani React chizadi: qidiruv botlari uchun
         statik matn (#seo-static) foydalanuvchiga bir lahza ham ko'rinmaydi -->
    <script>
      // JS bor + tanlangan rejim (och/qorong'i) CSS yuklanishidan OLDIN — sahifa
      // noto'g'ri rangda "chaqnab" qolmasin (kalit: AppSettingsContext THEME_KEY)
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var mode = 'light';
        try { if (localStorage.getItem('bc.theme') === 'dark') mode = 'dark'; } catch (e) {}
        d.setAttribute('data-theme', mode);
        d.style.colorScheme = mode;
        d.style.background = mode === 'dark' ? '#0b0d0c' : '#f3efe6';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'dark' ? '#0b0d0c' : '#f3efe6');
      })();
    </script>
    <style>html.js #seo-static { display: none; }</style>

    <!-- SEO: sarlavha, tavsif, canonical, hreflang, Open Graph — build paytida har
         sahifa uchun vite-plugin-seo.ts to'ldiradi (manba: src/seo/site.ts va landing
         tarjimalari). Bu yerga qo'lda yozmang. -->
    <!--seo:head-->
    <!--/seo:head-->
  </head>
  <body>
    <div id="root"><!--seo:body--><!--/seo:body--></div>
    <!-- JSON-LD (tuzilgan ma'lumotlar) — #root dan TASHQARIDA: React #root ni
         tozalaganda o'chib ketmasin; <head> ni ham og'irlashtirmaydi -->
    <!--seo:data--><!--/seo:data-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
