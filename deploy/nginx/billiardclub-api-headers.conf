# Billiard Club — /api/ location uchun (nginx).
#
# Serverdagi joyi:  /etc/nginx/snippets/billiardclub-api-headers.conf
# Ulanishi:         location /api/ { ... include snippets/billiardclub-api-headers.conf; }
#
# Node server (server/src/main.ts, helmet) API javoblariga o'zining xavfsizlik sarlavhalarini
# qo'yadi. nginx ham server darajasida qo'yganda ular ikki marta yuboriladi (skanerlar buni
# xato deb ko'rsatadi). Shu yerda Node'nikilari yashiriladi — javobda nginx'dagi bitta to'plam qoladi.
#
# Muhim: agar location /api/ ichida o'zining add_header qatori bo'lsa, server darajasidagi
# sarlavhalar meros qilinmaydi — u holda location'ga billiardclub-security-headers.conf ham ulang.

proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
