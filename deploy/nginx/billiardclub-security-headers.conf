# Billiard Club — HTTP xavfsizlik sarlavhalari (nginx).
#
# Serverdagi joyi:  /etc/nginx/snippets/billiardclub-security-headers.conf
# Ulanishi:         billiardclub.uz ning 443-portli server { } blokiga (www bo'lsa, unga ham):
#                       include snippets/billiardclub-security-headers.conf;
#
# DIQQAT — nginx'ning eng ko'p uchraydigan xatosi: biror location { } ichida O'ZINING
# add_header qatori bo'lsa (masalan /assets/ uchun Cache-Control), server darajasidagi
# add_header'lar u location'ga MEROS QILINMAYDI. Bunday location'larga ham shu include
# qatorini qo'shing. To'liq yo'riqnoma: deploy/nginx/README.md.
#
# Sarlavhalar sayt sahifalari (client/dist) uchun. /api/ javoblariga Node (helmet) o'zi
# qo'yadi — takrorlanmasligi uchun /api/ location'iga billiardclub-api-headers.conf ulanadi.

# HTTPS ni majburlash: 1 yil, barcha subdomenlar (www va mail ham HTTPS da ishlaydi).
# `preload` ataylab yo'q — u hstspreload.org ga yozilishni anglatadi va orqaga qaytarish oylab
# davom etadi. Kerak bo'lsa keyinroq qo'shiladi.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Clickjacking: sayt boshqa domendagi <iframe> ichida ochilmaydi
# (eski brauzerlar uchun; yangilari CSP frame-ancestors ni ishlatadi).
add_header X-Frame-Options "SAMEORIGIN" always;

# Brauzer fayl turini taxmin qilmaydi (rasm yoki matn skript sifatida ishga tushmaydi).
add_header X-Content-Type-Options "nosniff" always;

# Tashqi saytlarga to'liq URL emas, faqat domen yuboriladi.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Kassa ilovasiga kerak bo'lmagan qurilma imkoniyatlari o'chiriladi.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Boshqa domendan ochilgan oyna sahifaga `window.opener` orqali tegolmaydi (tabnabbing, Spectre).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy: sahifa faqat o'z domenidan skript, uslub, rasm va ulanish yuklaydi.
#  - script-src 'self'          — ichki (inline) skript YO'Q; build buni tekshiradi (client/vite-plugin-seo.ts)
#  - style-src 'unsafe-inline'  — Ant Design uslublarni <style> sifatida yozadi (CSS-in-JS),
#                                 chek chop etish iframe'i ham ichki uslub ishlatadi
#  - img-src/media-src blob:    — yuklangan rasmlar va fayllarning ko'rinishi (URL.createObjectURL)
#  - connect-src 'self'         — API shu domenda (/api)
#  - frame-ancestors 'self'     — clickjacking'dan himoya (X-Frame-Options ning zamonaviy o'rnini bosuvchisi)
# Android ilova (Capacitor) HTML ni o'zi yuklab, server sarlavhalarini o'tkazmaydi — unga ta'sir qilmaydi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
